<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Habit Tracker</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #1a1410; color: #f5efe6; min-height: 100vh; padding: 20px 16px 40px; transition: background 0.3s, color 0.3s; }
    body.light { background: #fff8f0; color: #2a1f18; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 4px; letter-spacing: -0.5px; background: linear-gradient(135deg, #ff9f1c, #ff6b35); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { text-align: center; font-size: 14px; opacity: 0.55; margin-bottom: 22px; }
    .theme-toggle { position: fixed; top: 16px; right: 16px; background: rgba(255, 159, 28, 0.15); border: none; border-radius: 30px; padding: 8px 14px; color: #ff9f1c; font-size: 18px; cursor: pointer; z-index: 999; }
    body.light .theme-toggle { background: rgba(255, 107, 53, 0.12); }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .stat-card { background: rgba(255, 159, 28, 0.08); border-radius: 18px; padding: 12px 8px; text-align: center; border: 1px solid rgba(255, 159, 28, 0.15); }
    body.light .stat-card { background: rgba(255, 159, 28, 0.1); border-color: rgba(255, 107, 53, 0.2); }
    .stat-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.55; font-weight: 600; }
    .stat-card .value { font-size: 26px; font-weight: 800; margin-top: 2px; }
    .stat-card .value.amber { color: #ff9f1c; }
    .stat-card .value.coral { color: #ff6b35; }
    .stat-card .value.mint { color: #06d6a0; }

    /* Add form */
    .add-form { display: flex; gap: 8px; background: rgba(255, 159, 28, 0.06); border-radius: 18px; padding: 12px; margin-bottom: 18px; border: 1px solid rgba(255, 159, 28, 0.15); }
    body.light .add-form { background: rgba(255, 159, 28, 0.08); }
    .add-form input { flex: 1; background: rgba(255, 159, 28, 0.06); border: 1px solid rgba(255, 159, 28, 0.2); border-radius: 14px; padding: 12px 16px; color: #f5efe6; font-size: 15px; outline: none; }
    body.light .add-form input { background: rgba(255, 255, 255, 0.6); color: #2a1f18; }
    .add-form input:focus { border-color: #ff9f1c; }
    .add-form input::placeholder { color: rgba(245, 239, 230, 0.4); }
    body.light .add-form input::placeholder { color: rgba(42, 31, 24, 0.4); }
    .add-btn { background: linear-gradient(135deg, #ff9f1c, #ff6b35); border: none; border-radius: 14px; padding: 0 20px; font-size: 22px; font-weight: 700; color: #fff; cursor: pointer; transition: transform 0.12s; box-shadow: 0 4px 14px rgba(255, 107, 53, 0.3); }
    .add-btn:active { transform: scale(0.94); }

    /* Habit list */
    .habit-list { display: flex; flex-direction: column; gap: 12px; }
    .habit-card { background: rgba(255, 159, 28, 0.05); border-radius: 20px; padding: 16px; border: 1px solid rgba(255, 159, 28, 0.12); transition: all 0.25s; position: relative; overflow: hidden; }
    body.light .habit-card { background: rgba(255, 255, 255, 0.6); border-color: rgba(255, 107, 53, 0.15); }
    .habit-card.done-today { border-color: rgba(6, 214, 160, 0.4); background: rgba(6, 214, 160, 0.06); }
    body.light .habit-card.done-today { background: rgba(6, 214, 160, 0.1); }

    .habit-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }

    /* Custom circular check button with gradient ring */
    .check-btn { width: 52px; height: 52px; min-width: 52px; border-radius: 50%; background: transparent; border: 2.5px solid rgba(255, 159, 28, 0.35); cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .check-btn::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: linear-gradient(135deg, #ff9f1c, #ff6b35); opacity: 0; transform: scale(0.3); transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .check-btn.checked { border-color: #06d6a0; }
    .check-btn.checked::after { background: linear-gradient(135deg, #06d6a0, #00b894); opacity: 1; transform: scale(1); }
    .check-btn .check-icon { position: relative; z-index: 1; color: #fff; font-size: 24px; font-weight: 800; opacity: 0; transform: scale(0); transition: all 0.2s; }
    .check-btn.checked .check-icon { opacity: 1; transform: scale(1); }
    .check-btn:active { transform: scale(0.9); }

    .habit-info { flex: 1; min-width: 0; }
    .habit-name { font-size: 16px; font-weight: 700; line-height: 1.3; word-wrap: break-word; }
    .habit-streak { font-size: 12px; opacity: 0.6; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
    .habit-streak .flame { color: #ff9f1c; }

    .delete-btn { background: transparent; border: none; color: rgba(245, 239, 230, 0.25); font-size: 22px; cursor: pointer; padding: 4px 6px; line-height: 1; transition: color 0.15s; align-self: flex-start; }
    body.light .delete-btn { color: rgba(42, 31, 24, 0.25); }
    .delete-btn:hover { color: #ff6b35; }

    /* 7-day dots */
    .week-dots { display: flex; gap: 6px; justify-content: space-between; margin-top: 8px; }
    .day-dot { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .day-dot .dot { width: 100%; aspect-ratio: 1; max-width: 28px; border-radius: 50%; background: rgba(255, 159, 28, 0.12); border: 1.5px solid rgba(255, 159, 28, 0.2); transition: all 0.2s; }
    .day-dot .dot.filled { background: linear-gradient(135deg, #ff9f1c, #ff6b35); border-color: transparent; box-shadow: 0 2px 8px rgba(255, 107, 53, 0.35); }
    .day-dot .dot.today { border-color: #ff9f1c; border-width: 2px; }
    .day-dot .day-label { font-size: 9px; text-transform: uppercase; opacity: 0.5; font-weight: 600; letter-spacing: 0.3px; }

    .empty-state { text-align: center; opacity: 0.4; padding: 50px 20px; font-size: 14px; line-height: 1.6; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
    .modal-box { background: #2a1f18; border-radius: 20px; padding: 24px; max-width: 320px; width: 100%; text-align: center; border: 1px solid rgba(255, 159, 28, 0.2); }
    body.light .modal-box { background: #fff; border-color: rgba(255, 107, 53, 0.2); }
    .modal-box h3 { font-size: 17px; margin-bottom: 8px; }
    .modal-box p { font-size: 14px; opacity: 0.7; margin-bottom: 18px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button { flex: 1; padding: 11px; border-radius: 14px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    .modal-cancel { background: rgba(255, 159, 28, 0.12); color: #ff9f1c; }
    body.light .modal-cancel { background: rgba(255, 159, 28, 0.15); }
    .modal-confirm { background: linear-gradient(135deg, #ff9f1c, #ff6b35); color: #fff; }

    /* Toast */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ff9f1c, #ff6b35); color: #fff; padding: 12px 22px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 10001; max-width: 90%; text-align: center; box-shadow: 0 8px 24px rgba(255, 107, 53, 0.4); }

    /* Confetti burst on check-in */
    .burst { position: fixed; pointer-events: none; z-index: 9999; font-size: 24px; animation: burstOut 0.7s ease-out forwards; }
    @keyframes burstOut {
        0% { transform: translate(0,0) scale(0.5); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
    }
</style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <div class="container">
        <h1>Habit Tracker</h1>
        <p class="subtitle">Build better habits, one day at a time</p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Habits</div>
                <div class="value amber" id="totalHabits">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Done Today</div>
                <div class="value mint" id="doneToday">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Best Streak</div>
                <div class="value coral" id="bestStreak">0</div>
            </div>
        </div>

        <div class="add-form">
            <input type="text" id="habitInput" placeholder="New habit (e.g. Read 30 min)" maxlength="60">
            <button class="add-btn" id="addBtn">+</button>
        </div>

        <div class="habit-list" id="habitList">
            <div class="empty-state">
                No habits yet.<br>Add your first one above! 🌱
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'habitTrackerData';
        const THEME_KEY = 'habitTrackerTheme';
        const DAY_NAMES = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

        let habits = [];
        let audioCtx = null;

        // ========== SOUND (completely different from Mood Booster & TaskFlow) ==========
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                if (type === 'add') {
                    // 🎈 FM "boop" — un sunet de balon care se umflă
                    const carrier = audioCtx.createOscillator();
                    const modulator = audioCtx.createOscillator();
                    const modGain = audioCtx.createGain();
                    const gain = audioCtx.createGain();

                    carrier.type = 'sine';
                    carrier.frequency.setValueAtTime(400, audioCtx.currentTime);
                    carrier.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.12);

                    modulator.type = 'sine';
                    modulator.frequency.value = 200;
                    modGain.gain.value = 80;

                    modulator.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(gain);
                    gain.connect(audioCtx.destination);

                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                    carrier.start();
                    modulator.start();
                    carrier.stop(audioCtx.currentTime + 0.15);
                    modulator.stop(audioCtx.currentTime + 0.15);

                } else if (type === 'check') {
                    // 🔔 Soft wooden bell — 3 harmonice, decay lung
                    const freqs = [880, 1320, 1760];
                    freqs.forEach((f, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = f;
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        const vol = 0.12 / (i + 1);
                        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.5);
                    });

                } else if (type === 'uncheck') {
                    // 🪵 Short descending "tick"
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(700, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.06);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);

                } else if (type === 'delete') {
                    // 💨 Low thud with slight noise
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }
            } catch (e) { console.log('Audio error:', e); }
        }

        function vibrate(pattern) {
            if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
        }

        // ========== STORAGE ==========
        function loadHabits() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    habits = Array.isArray(parsed) ? parsed.filter(h => h && h.id && h.name) : [];
                }
            } catch (e) { habits = []; }
        }

        function saveHabits() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); } catch (e) {}
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        // ========== DATE HELPERS ==========
        function todayKey() {
            const d = new Date();
            return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
        }

        function dayKeyFromDate(date) {
            return date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate();
        }

        function getLast7Days() {
            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                d.setHours(0, 0, 0, 0);
                days.push(d);
            }
            return days;
        }

        function calculateStreak(habit) {
            if (!habit.checkIns || habit.checkIns.length === 0) return 0;
            const set = new Set(habit.checkIns);
            let streak = 0;
            const checkDate = new Date();
            checkDate.setHours(0, 0, 0, 0);
            // Dacă azi nu e bifat, începem de la ieri
            if (!set.has(dayKeyFromDate(checkDate))) {
                checkDate.setDate(checkDate.getDate() - 1);
            }
            while (set.has(dayKeyFromDate(checkDate))) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            }
            return streak;
        }

        // ========== RENDER ==========
        function renderHabits() {
            const container = document.getElementById('habitList');

            if (habits.length === 0) {
                container.innerHTML = `<div class="empty-state">No habits yet.<br>Add your first one above! 🌱</div>`;
                return;
            }

            const today = todayKey();
            const weekDays = getLast7Days();

            container.innerHTML = habits.map(habit => {
                const isDoneToday = (habit.checkIns || []).includes(today);
                const streak = calculateStreak(habit);
                const checkIns = habit.checkIns || [];

                const dotsHTML = weekDays.map(day => {
                    const key = dayKeyFromDate(day);
                    const filled = checkIns.includes(key);
                    const isToday = key === today;
                    return `
                        <div class="day-dot">
                            <div class="dot ${filled ? 'filled' : ''} ${isToday ? 'today' : ''}"></div>
                            <div class="day-label">${DAY_NAMES[day.getDay()]}</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="habit-card ${isDoneToday ? 'done-today' : ''}">
                        <div class="habit-top">
                            <div class="check-btn ${isDoneToday ? 'checked' : ''}" data-check="${habit.id}">
                                <span class="check-icon">✓</span>
                            </div>
                            <div class="habit-info">
                                <div class="habit-name">${escapeHtml(habit.name)}</div>
                                <div class="habit-streak">
                                    <span class="flame">🔥</span> ${streak} ${streak === 1 ? 'day' : 'days'} streak
                                </div>
                            </div>
                            <button class="delete-btn" data-delete="${habit.id}">×</button>
                        </div>
                        <div class="week-dots">${dotsHTML}</div>
                    </div>
                `;
            }).join('');

            // Attach listeners
            container.querySelectorAll('[data-check]').forEach(el => {
                el.addEventListener('click', () => toggleCheckIn(el.dataset.check, el));
            });
            container.querySelectorAll('[data-delete]').forEach(el => {
                el.addEventListener('click', () => deleteHabit(el.dataset.delete));
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats() {
            const total = habits.length;
            const today = todayKey();
            const done = habits.filter(h => (h.checkIns || []).includes(today)).length;
            const best = habits.reduce((max, h) => Math.max(max, calculateStreak(h)), 0);

            document.getElementById('totalHabits').textContent = total;
            document.getElementById('doneToday').textContent = done;
            document.getElementById('bestStreak').textContent = best;
        }

        // ========== ACTIONS ==========
        function addHabit() {
            const input = document.getElementById('habitInput');
            const name = input.value.trim();
            if (!name) { showToast('Write a habit first!'); return; }

            habits.push({
                id: Date.now().toString(),
                name: name,
                checkIns: [],
                createdAt: new Date().toISOString()
            });
            saveHabits();
            input.value = '';
            playSound('add');
            vibrate(20);
            renderHabits();
            updateStats();
            showToast('🌱 Habit added!');
        }

        function toggleCheckIn(id, btnEl) {
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            if (!habit.checkIns) habit.checkIns = [];
            const today = todayKey();
            const idx = habit.checkIns.indexOf(today);

            if (idx >= 0) {
                // Uncheck
                habit.checkIns.splice(idx, 1);
                playSound('uncheck');
                vibrate(15);
            } else {
                // Check in
                habit.checkIns.push(today);
                playSound('check');
                vibrate([25, 20, 25]);
                // Emoji burst
                const rect = btnEl.getBoundingClientRect();
                launchBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            }

            saveHabits();
            renderHabits();
            updateStats();
        }

        function deleteHabit(id) {
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <h3>Delete habit?</h3>
                    <p>You will delete "<strong>${escapeHtml(habit.name)}</strong>" and all its history. This cannot be undone.</p>
                    <div class="modal-actions">
                        <button class="modal-cancel" id="modalCancel">Cancel</button>
                        <button class="modal-confirm" id="modalConfirm">Delete</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);

            overlay.querySelector('#modalCancel').addEventListener('click', () => overlay.remove());
            overlay.querySelector('#modalConfirm').addEventListener('click', () => {
                overlay.remove();
                playSound('delete');
                vibrate(25);
                habits = habits.filter(h => h.id !== id);
                saveHabits();
                renderHabits();
                updateStats();
                showToast('🗑️ Habit deleted');
            });
        }

        // ========== EMOJI BURST ==========
        function launchBurst(x, y) {
            const emojis = ['✨', '⭐', '🌟', '💫', '🌸', '🍀'];
            for (let i = 0; i < 6; i++) {
                const el = document.createElement('div');
                el.className = 'burst';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                const angle = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
                const distance = 60 + Math.random() * 50;
                el.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                el.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 800);
            }
        }

        // ========== THEME ==========
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
            try { localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark'); } catch (e) {}
        }

        function loadTheme() {
            try {
                if (localStorage.getItem(THEME_KEY) === 'light') {
                    document.body.classList.add('light');
                    document.getElementById('themeToggle').textContent = '☀️';
                }
            } catch (e) {}
        }

        // ========== INIT ==========
        function init() {
            loadTheme();
            loadHabits();
            renderHabits();
            updateStats();

            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('addBtn').addEventListener('click', addHabit);
            document.getElementById('habitInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addHabit();
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
